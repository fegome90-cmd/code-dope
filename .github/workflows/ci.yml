name: Bootstrap
on:
  pull_request:
    branches: [developer, tester, main]
  push:
    branches: [tester, main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm typecheck
      - run: pnpm test
  secrets:
    name: Secrets and private paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 2 "${GITLEAKS_URL}" -o gitleaks.tar.gz
          printf '%s  gitleaks.tar.gz\n' "${GITLEAKS_SHA256}" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash scripts/check-secrets.sh history
      - run: node --test scripts/scan-staged-secrets.test.mjs
  docs:
    name: Documentation links and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-docs.mjs
  lint-common:
    name: Cross-language config linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.12"
      - run: uv sync --frozen --no-install-project
      - run: uv run yamllint .
      - run: uv run shellcheck scripts/check-secrets.sh
      - run: uv run codespell
      - name: Run Ruff on Python files if present
        run: |
          py_files=$(git ls-files '*.py')
          if [ -n "${py_files}" ]; then
            uv run ruff check
            uv run ruff format --check
          fi
